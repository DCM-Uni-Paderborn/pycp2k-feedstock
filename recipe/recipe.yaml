schema_version: 1

context:
  name: pycp2k
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8b1ebcdcc9326463fe90102a133142d1e5ae94d154689f6df9674851b0152fce

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.23

tests:
  - python:
      imports:
        - cp2k
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: Direct, in-process Python interface to libcp2k
  description: |
    pycp2k calls the C API of libcp2k in the Python process using ctypes.
    The shared CP2K library and its numerical dependencies are installed separately.
  homepage: https://www.cp2k.org
  repository: https://github.com/cp2k/cp2k
  documentation: https://github.com/cp2k/cp2k/blob/master/python/README.md

extra:
  recipe-maintainers:
    - jan-janssen
    - lauri-codes
